  description: >
    Trying to make Code Gemma Templates work
  template: |
    <start_of_turn>user
    You are an expert Python security researcher. You must generate a highly complex, structure-aware Atheris fuzzing harness for the provided target logic.

    ### LOGICAL REASONING STEPS TO EXECUTE:
    1. **Type Inference**: Analyze the target code below. Deduce the exact object hierarchies and custom classes required.
    2. **Data Generation**: Use `atheris.FuzzedDataProvider` to generate raw primitives, then logically construct the complex nested objects required by the target. Restrict any recursive data generation to a maximum depth of 5 to prevent StackOverflow crashes.
    3. **Dependency Mocking**: If the target function performs file I/O, network requests (HTTP), or database queries, you MUST import the `unittest.mock` library and use `patch` to mock these external dependencies within `TestOneInput`. The fuzzer must operate in total isolation.
    4. **Validation Check**: If the constructed data is logically invalid before passing it to the target function, execute a `return` to skip the iteration and preserve execution speed.

    ### ATHERIS API REFERENCE
    - `ConsumeBytes(count: int)`
    - `ConsumeUnicodeNoSurrogates(count: int)`
    - `ConsumeFloatListInRange(count: int, min: float, max: float)`
    - `PickValueInList(l: list)`

    ### EXAMPLE: MOCKING AND HIERARCHICAL DATA HANDLING
    ```python
    import sys
    import atheris
    from unittest.mock import patch, MagicMock

    with atheris.instrument_imports():
        from cloud_processor import analyze_payload, ServerContext

    def TestOneInput(data: bytes):
        fdp = atheris.FuzzedDataProvider(data)

        # Step 1: Generate Primitives using FDP
        session_id = fdp.ConsumeUnicodeNoSurrogates(16)
        risk_score = fdp.ConsumeFloatInRange(0.0, 1.0)
        server_region = fdp.PickValueInList()

        # Step 2: Construct Complex Object
        context_obj = ServerContext(id=session_id, risk=risk_score, region=server_region)

        # Step 3: Isolate execution by mocking network dependencies
        with patch('cloud_processor.requests.post') as mock_post:
            mock_post.return_value.status_code = 200
            try:
                analyze_payload(context_obj)
            except (ValueError, KeyError, TypeError):
                # Ignore exceptions related to expected input sanitization
                pass

    if __name__ == "__main__":
        atheris.Setup(sys.argv, TestOneInput)
        atheris.Fuzz()
    TARGET CODE
    {INSERT_COMPLEX_TARGET_SOURCE_CODE_HERE}

    Generate the fully self-contained fuzzing script executing the precise logical reasoning steps and mock implementation logic shown above.<end_of_turn>
