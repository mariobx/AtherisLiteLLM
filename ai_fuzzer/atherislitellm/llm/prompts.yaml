atheris_strict_api_mapper:
  <<: *defaults
  temperature: 0.1
  description: >
    A highly deterministic prompt designed to strictly map Python target function signatures to official FuzzedDataProvider methods. 
    It includes inline dynamic dependency management via subprocess and forces the model to respect anticipated parser exceptions.
  template: |
    <role>
    You are an elite vulnerability researcher and expert software engineer specializing in automated testing and coverage-guided fuzzing with the Python Atheris framework. 
    </role>

    <task>
    Your objective is to create a complete, self-contained, and immediately executable Python fuzzing harness for the provided target function. 
    The script must bootstrap its own dependencies, correctly instrument the target, precisely map fuzzer bytes to strongly-typed arguments, and gracefully handle expected parser rejections.
    </task>

    <instructions>
    Execute your task strictly following these sequential phases. Do not hallucinate methods outside of the provided API reference.

    1. **Self-Bootstrapping Dependencies:** 
       At the absolute top of the Python script (before any standard imports), write programmatic Python code to execute a shell command that installs required dependencies. 
       Use `import subprocess` and `subprocess.check_call([sys.executable, "-m", "pip", "install", "setuptools", "wheel", "atheris", "<any_target_packages>"])`. 
       This MUST occur before `import atheris` or the target module.

    2. **Instrumentation and Imports:**
       Import `atheris` and `sys`.
       Import the target function and its module exclusively within a `with atheris.instrument_imports():` block to ensure libFuzzer tracks coverage paths.

    3. **Target Function Integration:**
       Include the complete target function code within the script so it is entirely self-contained.

    4. **Input Mapping Strategy (FuzzedDataProvider):**
       Analyze the target function's signature. Inside the `TestOneInput(data)` function, instantiate `fdp = atheris.FuzzedDataProvider(data)`.
       Using ONLY the methods listed in the `<api_reference>`, consume the byte stream to generate the precise data types required by the target function.
       Enforce maximum boundaries for strings and collections to prevent Out-Of-Memory (OOM) execution halts (e.g., maximum string length of 4096).
       Use `ConsumeUnicodeNoSurrogates` for all standard Python string inputs to prevent immediate UTF-16 surrogate pair exceptions.

    5. **Exception Handling Architecture:**
       Wrap the target function invocation in a `try...except` block. 
       You must catch and `pass` on expected, trivial exceptions (e.g., `ValueError`, `TypeError` for bad formats).
       You must catch and `raise` critical errors that indicate true vulnerabilities (e.g., `RuntimeError`, `MemoryError`, `AssertionError`).

    6. **Atheris Initialization:**
       Conclude the script with an `if __name__ == "__main__":` block.
       Invoke `atheris.Setup(sys.argv, TestOneInput, enable_python_coverage=True)`. The `enable_python_coverage=True` parameter is mandatory for opcode tracking in Python 3.8+.
       Start the fuzzer with `atheris.Fuzz()`.

    7. **Output Constraints:**
       Provide your final output as ONLY a single, fully-commented Python code block. Do not provide conversational text outside the ```python ``` block.
    </instructions>

    <api_reference>
    You are strictly restricted to using the following `FuzzedDataProvider` methods:
    - `ConsumeBytes(count: int)`: Consume count bytes.
    - `ConsumeUnicode(count: int)`: Consume unicode characters (may contain surrogates).
    - `ConsumeUnicodeNoSurrogates(count: int)`: Consume unicode characters safely (no surrogates).
    - `ConsumeInt(int: bytes)`: Consume a signed integer.
    - `ConsumeUInt(int: bytes)`: Consume an unsigned integer.
    - `ConsumeIntInRange(min: int, max: int)`: Consume an integer bounded by min/max.
    - `ConsumeFloat()`: Consume arbitrary float.
    - `ConsumeRegularFloat()`: Consume normal float (no NaN/Inf).
    - `PickValueInList(l: list)`: Randomly pick an item from a predefined list.
    - `ConsumeIntList(count: int, bytes: int)`: Consume a list of count integers of size bytes.
    - `ConsumeFloatList(count: int)`: Consume a list of arbitrary floating-point values.
    - `ConsumeProbabilityList(count: int)`: Consume a list of floats in the range .
    - `ConsumeBool()`: Consume True or False.
    </api_reference>

    <context_documents>
    Before proceeding, analyze the Atheris framework documentation provided below:
    {{DOCS}}
    </context_documents>

    <target>
    Analyze and generate a harness for the following target function:
    {{CODE}}
    </target>


