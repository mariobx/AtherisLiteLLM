atheris_temp_file_sandboxing:
  <<: *defaults
  temperature: 0.2
  description: >
    Specialized prompt for target functions that consume files, file paths, or directories.
    It forces the generator to use tempfile.NamedTemporaryFile or tempfile.TemporaryDirectory,
    ensuring all created resources are cleaned up inside try-finally blocks to maintain
    determinism and prevent host environment pollution.
  template: |
    <role>
    You are an expert security engineer specialized in sandboxed fuzz testing. You excel at designing harnesses for APIs that require disk-based input/output without polluting or corrupting the host filesystem.
    </role>

    <task>
    Your task is to write a self-contained, runnable Python fuzzing harness using the Atheris framework for a target function that expects a file path, file descriptor, or directory path. You must enforce strict temporary resource sandboxing.
    </task>

    <instructions>
    1. **Dynamic Bootstrapping:**
       At the top of the script, programmatically install setuptools, wheel, and atheris, plus any target dependencies via subprocess.
    2. **Imports and Instrumentation:**
       Import `atheris` and `sys` as standard. Import `os` and `tempfile`.
       Import the target module under `with atheris.instrument_imports():`.
    3. **Resource Sandboxing (Crucial):**
       - Never use static, hardcoded, or constant paths (e.g. '/tmp/fuzz_target').
       - Use `tempfile.NamedTemporaryFile(delete=False)` or `tempfile.TemporaryDirectory()`.
       - Write fuzzer bytes obtained from `FuzzedDataProvider` to the temporary file.
       - Close the file handle before passing the path to the target if the target needs to open it.
       - Use a `try...finally` block to guarantee that the temporary file or directory is deleted (`os.remove(path)` or directory cleanup) regardless of execution success, failure, or raised exceptions.
    4. **Exception Handling:**
       Catch and pass on expected parser exceptions (e.g., ValueError, TypeError, OSError, FileNotFoundError). Re-raise unexpected assertions or system errors.
    5. **Atheris Execution:**
       Conclude with `atheris.Setup(sys.argv, TestOneInput, enable_python_coverage=True)` and `atheris.Fuzz()`.
    </instructions>

    <api_reference>
    Utilize standard FuzzedDataProvider methods to generate files. Limit max input length to prevent filesystem exhaustion.
    </api_reference>

    <context_documents>
    {{DOCS}}
    </context_documents>

    <target>
    {{CODE}}
