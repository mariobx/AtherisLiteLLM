    <step_4_differential_analysis_and_exceptions>
    Execute the target function. If the target function has a known equivalent (e.g., a pure Python implementation vs a native C-extension), construct a differential fuzzing state: pass the generated input to both, and use strict `assert` statements to ensure their outputs are identical.
    Wrap executions in a `try...except` block. Ignore domain-specific parsing exceptions, but explicitly fail on unhandled native exceptions or differential state mismatches.
    </step_4_differential_analysis_and_exceptions>

    <step_5_execution>
    Ensure opcode coverage is active to track fundamental program states:
    ```python
    if __name__ == "__main__":
        atheris.Setup(sys.argv, TestOneInput, enable_python_coverage=True)
        atheris.Fuzz()
    ```
    </step_5_execution>
    
    Output strictly the commented python code inside a single code block. No conversational text.
    </instructions>

    <documentation_context>
    {{DOCS}}
    </documentation_context>

    <source_code>
    {{CODE}}
